<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Aplikasi Web</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8f9fa;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Layar Loading saat GAS sedang dimuat */
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e2e8f0;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #loader p {
      color: #475569;
      font-size: 14px;
      font-weight: 500;
    }

    /* Iframe Fullscreen */
    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Indikator Loading -->
  <div id="loader">
    <div class="spinner"></div>
    <p>Memuat aplikasi...</p>
  </div>

  <!-- Embed Google Apps Script -->
  <iframe 
    id="gas-frame"
    src="https://script.google.com/macros/s/AKfycbxvw3z5AensOiVWzdWmjzsRob7vijknyOHc_Ui6b7o8Y71R-s5I1s7BODeytgsR1lTTQQ/exec"
    allow="geolocation *; microphone *; camera *; clipboard-read *; clipboard-write *"
    allowfullscreen="true"
    onload="hideLoader()">
  </iframe>

  <script>
    function hideLoader() {
      const loader = document.getElementById('loader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => {
          loader.style.display = 'none';
        }, 400);
      }
    }

    // Fallback: sembunyikan loader otomatis setelah 8 detik jika event onload tertahan
    setTimeout(hideLoader, 8000);
  </script>

</body>
</html>
